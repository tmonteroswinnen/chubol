<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CHUBOL</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234c8b3d'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e07a2c'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #14100d;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      #game canvas { display: block; touch-action: none; }
      #boot-msg {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f2c14e;
        letter-spacing: 0.14em;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="game"><div id="boot-msg">CARGANDO CHUBOL…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
