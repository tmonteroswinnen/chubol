<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>CHUBOL</title>
    <meta name="description" content="Básquet de patio: de a dos, un minuto por pareja, siete marcas." />
    <meta name="theme-color" content="#14100d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CHUBOL" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/ui/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/ui/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /*
          Darker than the game's own background on purpose. The canvas is 3:2 and
          a phone is much wider, so there are dead bands at the sides; when they
          were the same colour as the margins of the game nobody could tell where
          the game ended, and a thumb parked on a dead band feels like a thumb
          parked on the game.
        */
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: Consolas, "Courier New", monospace;
        /* A finger dragging on the court must never scroll or select the page. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: grid;
        place-items: center;
        /*
          Keep the canvas clear of the notch and of the home indicator. Phaser
          sizes itself to this box, so insetting it shrinks the canvas instead of
          hiding part of it — which matters because the shoot button lives hard
          against the right edge.
        */
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #boot-msg {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f2c14e;
        letter-spacing: 0.14em;
        font-size: 14px;
      }

      /*
        The artwork is 3:2 and must not be cropped, so a phone held upright has
        nowhere to put it. Rather than shrink the court to a stamp, ask for the
        phone to be turned. Only on touch screens: a narrow desktop window is
        still perfectly playable.
      */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #game {
          display: none;
        }
        #rotate {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: calc(24px + env(safe-area-inset-top, 0px)) 28px;
          text-align: center;
          color: #f3ead2;
          background: #14100d;
        }
        #rotate .phone {
          width: 74px;
          height: 120px;
          margin: 0 auto 26px;
          border: 5px solid #f5a81c;
          border-radius: 12px;
          animation: turn 2.2s ease-in-out infinite;
        }
        #rotate h1 {
          margin: 0 0 10px;
          font-size: 22px;
          letter-spacing: 0.1em;
          color: #f5a81c;
        }
        #rotate p {
          margin: 0;
          font-size: 15px;
          line-height: 1.5;
          opacity: 0.85;
        }
      }
      @keyframes turn {
        0%,
        40% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"><div id="boot-msg">CARGANDO CHUBOL…</div></div>
    <div id="rotate" role="alert">
      <div>
        <div class="phone" aria-hidden="true"></div>
        <h1>GIRÁ EL TELÉFONO</h1>
        <p>CHUBOL se juega apaisado.<br />La cancha no entra de otra forma.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
