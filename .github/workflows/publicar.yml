# Publica CHUBOL en GitHub Pages en cada push.
#
# Hay que habilitarlo una sola vez, a mano, en el navegador:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# El build es el de publicar, que deja afuera references/ — la ilustración
# original, el croquis y la foto del perro. Son material de origen, no parte del
# juego, y son más de la mitad del peso del sitio.
name: publicar

on:
  push:
    branches: [chubol-primera-version, main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llega otro push mientras corre, gana el nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Las reglas y la física tienen tests: si alguno falla, no se publica.
      - run: pnpm test

      - run: pnpm run build:publicar

      # enablement: activa Pages desde acá si todavía no estaba activado. Sin
      # esto, la primera corrida falla cuando el push llega antes de que alguien
      # toque el interruptor en Settings, que es exactamente lo que pasó.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
